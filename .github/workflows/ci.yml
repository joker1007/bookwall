name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-test:
    name: Server (RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7

      # libvips backs the Active Storage thumbnail variants (ruby-vips loads it
      # through FFI), and Parsers::PdfParser shells out to poppler's pdftocairo
      # to rasterize PDF covers and pages.
      - name: Install libvips and poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libvips poppler-utils

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: server
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec

  server-lint:
    name: Server (RuboCop / Brakeman / bundler-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: server
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop --parallel

      # bin/brakeman adds --ensure-latest, which fails the run whenever a
      # newer brakeman is released than the one pinned in Gemfile.lock.
      # CI scans with the locked version instead.
      - name: Brakeman
        run: bundle exec brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: bundler-audit
        run: bin/bundler-audit

  client:
    name: Client (ESLint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this is the type check too.
      - name: Type check and build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install libvips and poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libvips poppler-utils

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: server
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: client

      # playwright.config.ts boots Falcon (RAILS_ENV=test_e2e, port 3001) and
      # Vite (port 5174) itself via its webServer entries.
      - name: Run Playwright
        run: npm run test:e2e
        working-directory: client

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 7

  android:
    name: Android (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Accepts the SDK licenses so AGP can auto-download the compileSdk
      # platform (android-36.1) and build-tools that the runner image lacks.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-report
          path: apps/android/app/build/reports/tests/
          retention-days: 7
