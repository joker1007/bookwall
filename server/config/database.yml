default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  pragmas:
    journal_mode: wal
    synchronous: normal
    foreign_keys: "on"
    busy_timeout: 5000
    temp_store: memory
    mmap_size: 134217728
    cache_size: -20000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

# Mirrors `test` but writes to its own SQLite file so the Playwright e2e
# suite (RAILS_ENV=test_e2e) never shares state with rspec (RAILS_ENV=test).
test_e2e:
  <<: *default
  database: storage/test_e2e.sqlite3

# Production stores every SQLite database under BOOKWALL_DATA_DIR so
# the Docker image can mount a single /config volume that captures
# both Active Storage attachments and the databases. Falls back to
# the in-tree `storage/` directory for ad-hoc bare-metal runs.
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("BOOKWALL_DATA_DIR", "storage") %>/production.sqlite3
  cache:
    <<: *default
    database: <%= ENV.fetch("BOOKWALL_DATA_DIR", "storage") %>/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("BOOKWALL_DATA_DIR", "storage") %>/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("BOOKWALL_DATA_DIR", "storage") %>/production_cable.sqlite3
    migrations_paths: db/cable_migrate
